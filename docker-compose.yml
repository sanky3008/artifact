services:
  artifact:
    build: .
    ports:
      - "3000:8000"
    volumes:
      - ./data:/data
    environment:
      - ARTIFACT_PASSWORD=${ARTIFACT_PASSWORD:-artifact}
      - ARTIFACT_UPLOAD_DIR=/data
      - ARTIFACT_FRONTEND_DIR=/app/frontend/dist
      - ARTIFACT_AUTH_MODE=${ARTIFACT_AUTH_MODE:-password}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - ARTIFACT_ALLOWED_DOMAIN=${ARTIFACT_ALLOWED_DOMAIN:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ARTIFACT_MCP_BASE_URL=${ARTIFACT_MCP_BASE_URL:-http://localhost:8000/mcp}
      - ARTIFACT_MCP_TOKEN=${ARTIFACT_MCP_TOKEN:-}
    restart: unless-stopped
